name: Supabase & Backend Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 5 days to prevent Supabase 7-day idle pause
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Request
        run: |
          API_URL="${{ secrets.BACKEND_API_URL || 'http://localhost:5000' }}"
          echo "Pinging $API_URL/api/v1/health"
          curl -s -f "$API_URL/api/v1/health" || echo "Keep-alive ping completed."
